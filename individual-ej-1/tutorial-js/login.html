<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Login/Registro</title>
</head>
<body class="h-screen w-full bg-slate-200 flex flex-col justify-center items-center">
    <main class="h-max w-full lg:w-1/2 max-w-md p-4">
        <h2 class="text-slate-800 font-semibold text-2xl text-center" id="formTitle">Inicio de sesión</h2>
        <form class="flex flex-col rounded-xl text-slate-200 p-4" id="loginForm" novalidate>
            <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                <i class="bi bi-envelope w-max text-lg text-slate-700"></i>
                <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400" type="email" id="email" name="email" required placeholder="Ingrese su email">
            </div>
            <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                <i class="bi bi-lock w-max text-lg text-slate-700"></i>
                <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400" type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
            </div>  
            <input onsubmit="() => {console.log('Form submitted');}" class="h-12 w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg cursor-pointer" type="submit" value="Iniciar sesión">
        </form>

        <form class="flex flex-col rounded-xl text-slate-200 p-4" id="registerForm" novalidate>
            <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                <i class="bi bi-person text-lg text-slate-700"></i>
                <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400" type="text" id="username" name="username" required placeholder="Ingrese su usuario">
            </div>
            <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                <i class="bi bi-envelope w-max text-lg text-slate-700"></i>
                <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400" type="email" id="email" name="email" required placeholder="Ingrese su email">
            </div>
            <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                <i class="bi bi-lock w-max text-lg text-slate-700"></i>
                <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400" type="password" id="password" name="password" required placeholder="Ingrese su contraseña">
            </div>  
            <input onsubmit="() => {console.log('Form submitted');}"  class="h-12 w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg cursor-pointer" type="submit" value="Crear cuenta">
        </form>

        <p class="text-center text-slate-400">¿Nuevo en la plataforma? <button class="text-slate-800 cursor-pointer hover:text-blue-400" id="toggleButton">Crear una cuenta</button></p>

        <div class="w-full flex flex-row justify-center align-center gap-4 mt-4 p-4">
            <a href="index.html" id="link" class="w-max h-10 min-h-max flex items-center justify-center align-middle px-6 py-2.5 bg-slate-300/40 border border-slate-300/90 text-slate-400 hover:bg-slate-300/90 hover:text-slate-600 rounded-lg">Ir a formulario basico</a>

            <a href="crud.html" id="link" class="w-max h-10 min-h-max flex items-center justify-center align-middle px-6 py-2.5 bg-slate-300/40 border border-slate-300/90 text-slate-400 hover:bg-slate-300/90 hover:text-slate-600 rounded-lg">Ir a CRUD</a>
        </div>
        
    </main>

    <script src="loginRegister.js"></script>
</body>
</html>
