<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <title>Formulario</title>
</head>
<body class="h-screen w-full bg-slate-900 flex flex-col justify-center items-center">
    
    <main id="index-max" class="w-1/2 max-w-md p-4">
        <form class="bg-transparent rounded-xl text-slate-200 mb-4" id="myForm" action="#" method="post" novalidate>
            <div class="index-field">
                <label for="name">Nombre:</label>
                <input class="index-input h-12 bg-slate-800 rounded-lg px-3 py-4 " type="text" id="name" name="name" required placeholder="Ingrese su nombre">
            </div>

            <div class="index-field">
                <label for="email">Correo electrónico:</label>
                <input class="index-input h-12 bg-slate-800 rounded-lg px-3 py-4" type="email" id="email" name="email" required placeholder="Ingrese su email">
            </div>

            <input class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg mt-2 cursor-pointer" type="submit" value="Enviar">

        </form>

        <p id="mensaje" class=" border p-4 rounded-xl mt-4 mb-4 text-sm"></p>

        

        <div class="w-full flex flex-row justify-center align-center gap-4 mt-4 p-4">
            <a href="login.html" id="link" class="w-full h-10 min-h-max flex items-center justify-center align-middle px-6 py-2.5 bg-slate-900/20 border border-slate-600/50 text-slate-400 hover:bg-slate-700/50 hover:text-white rounded-lg">Ir a Login/register</a>

            <a href="crud.html" id="link" class="w-full h-10 min-h-max flex items-center justify-center align-middle px-6 py-2.5 bg-slate-900/20 border border-slate-600/50 text-slate-400 hover:bg-slate-700/50 hover:text-white rounded-lg">Ir a CRUD</a>
        </div>
    </main>
    


    <script src="scriptConValidacion.js"></script>
</body>
</html>
