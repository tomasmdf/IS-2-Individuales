<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="output.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>CRUD</title>
</head>
<body class="h-screen w-full font-inter bg-slate-200 flex flex-col items-center">
    <main class="h-max w-full lg:w-1/3 p-4 flex flex-col gap-y-8">
        <div class="w-full flex flex-row justify-between align-center gap-x-4">
            <a href="index.html" id="link" class="w-max h-10 min-h-max flex items-center justify-center align-middle px-6 py-2.5 bg-slate-300/40 border border-slate-300/90 text-slate-400 hover:bg-slate-300/90 hover:text-slate-600 rounded-lg">Ir a formulario basico</a>

            <a href="login.html" id="link" class="w-max h-10 min-h-max flex items-center justify-center align-middle px-6 py-2.5 bg-slate-300/40 border border-slate-300/90 text-slate-400 hover:bg-slate-300/90 hover:text-slate-600 rounded-lg">Ir a Login/Register</a>
        </div>
        <section class="h-max flex flex-col gap-4">
            <h1 class="text-md font-semibold tracking-widest uppercase leading-0">CRUD</h1>
            <p class="text-sm text-slate-600">Este es un ejemplo de CRUD (Crear, Leer, Actualizar, Eliminar).</p>
            <form class="flex flex-col rounded-xl text-slate-200" id="crudForm" action="#" method="post" novalidate>
                <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                    <i class="bi bi-person-fill w-max text-lg text-slate-700"></i>
                    <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400 outline-0 border-0" type="email" id="nombre" name="nombre" required placeholder="Ingrese su nombre">
                </div>
                <div class="input-container bg-slate-300 rounded-md px-5 py-1 focus-within:bg-slate-400/50 gap-2">
                    <i class="bi bi-hammer w-max text-lg text-slate-700"></i>
                    <input class="bg-transparent h-12 w-full text-slate-800 placeholder-slate-400 outline-0 border-0" type="text" id="puesto" name="puesto" required placeholder="Ingrese su puesto">
                </div>  
                <input class="h-12 w-full py-2.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg cursor-pointer" type="submit" value="Agregar">
            </form>
            <p id="message" class="w-max text-sm font-semibold text-green-800 border-2 bg-green-100/50 border-green-700/30 p-2 rounded-md mb-2"></p>
        </section>
        <section class="h-max w-full flex flex-col gap-4">
            <h2 class="text-md font-semibold tracking-widest uppercase">Lista de empleados</h2>
            <ul id="employeeList" class="list-none  flex flex-col gap-2 ">
                <!-- Aquí se mostrarán los empleados agregados -->
            </ul>
        </section>
    </main>

    <script src="crud.js"></script>
</body>
</html>
