spring.application.name=spring-api

# ************************* MySQL Database Configuration ******************************
# spring.jpa.database=mysql
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/productdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234


spring.jpa.hibernate.ddl-auto=create
# Ensure Spring Boot runs the schema and data SQL files at startup
spring.datasource.initialization-mode=always

# This ensures that data.sql is executed during startup
spring.datasource.data=classpath:data.sql
spring.jpa.show-sql=true

server.port=8080