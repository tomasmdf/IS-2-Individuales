# =============================================================================
# application.properties  -  Configuración externa de Spring Boot
# =============================================================================
# Cada valor con la forma ${VARIABLE:defecto} se puede sobreescribir con una
# variable de entorno (útil para no dejar contraseñas en el repositorio).
# =============================================================================

spring.application.name=sistema-colegio
server.port=8080

# Idioma fijo en español: mensajes de validación, formatos de fecha/número
spring.web.locale=es_AR
spring.web.locale-resolver=fixed

# ----------------------------------------------------------------------------
# BASE DE DATOS: MySQL
# ----------------------------------------------------------------------------
# createDatabaseIfNotExist=true -> crea el esquema "colegio_db" si no existe.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:colegio_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Mendoza
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------------------------------------------
# JPA / HIBERNATE (ORM)
# ----------------------------------------------------------------------------
# ddl-auto=update -> Hibernate crea/actualiza las tablas a partir de las @Entity.
#   En PRODUCCIÓN se recomienda "validate" + migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# open-in-view=false -> la sesión de Hibernate NO se mantiene abierta durante el
#   renderizado de la vista. Obliga a convertir Entidad -> DTO dentro del servicio
#   (@Transactional), que es justamente el objetivo del patrón DTO.
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# THYMELEAF
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ----------------------------------------------------------------------------
# CORREO (SMTP)  -  usado para el correo de bienvenida a los docentes
# ----------------------------------------------------------------------------
# Ejemplo con Gmail: activar verificación en 2 pasos y crear una "contraseña de aplicación".
# Para pruebas sin enviar correos reales se puede usar Mailtrap (sandbox.smtp.mailtrap.io:2525)
# o MailHog/Mailpit (localhost:1025, sin auth).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ----------------------------------------------------------------------------
# PROPIEDADES PROPIAS DE LA APLICACIÓN (se leen con @Value)
# ----------------------------------------------------------------------------
# Enviar (true) o sólo registrar en el log (false) el correo de bienvenida
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@colegio.local}
# URL pública de la app: se usa para armar el enlace de "Ingresar" dentro del correo
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.nombre-colegio=${APP_NOMBRE_COLEGIO:Colegio San Martín}

# Usuario administrador inicial (se crea una sola vez, al primer arranque)
app.admin.correo=${APP_ADMIN_CORREO:admin@colegio.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin1234}
# Cargar grados, aulas, materias y alumnos de ejemplo si las tablas están vacías
app.seed-demo-data=${APP_SEED_DEMO:true}
