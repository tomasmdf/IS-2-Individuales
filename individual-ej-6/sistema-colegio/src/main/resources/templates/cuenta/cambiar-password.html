<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Cambiar contraseña', activo='', content=~{::main})}">
<main>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-4">Cambiar mi contraseña</h5>

                    <form th:action="@{/cuenta/cambiar-password}" th:object="${cambiarPasswordRequest}" method="post">

                        <div class="mb-3 form-password-toggle">
                            <label class="form-label" for="passwordActual">Contraseña actual</label>
                            <input type="password" id="passwordActual" class="form-control"
                                   th:field="*{passwordActual}"
                                   th:classappend="${#fields.hasErrors('passwordActual')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{passwordActual}"></div>
                        </div>

                        <div class="mb-3 form-password-toggle">
                            <label class="form-label" for="passwordNueva">Contraseña nueva</label>
                            <input type="password" id="passwordNueva" class="form-control"
                                   th:field="*{passwordNueva}"
                                   th:classappend="${#fields.hasErrors('passwordNueva')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{passwordNueva}"></div>
                        </div>

                        <div class="mb-3 form-password-toggle">
                            <label class="form-label" for="passwordConfirmacion">Confirmar contraseña nueva</label>
                            <input type="password" id="passwordConfirmacion" class="form-control"
                                   th:field="*{passwordConfirmacion}"
                                   th:classappend="${#fields.hasErrors('passwordConfirmacion')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{passwordConfirmacion}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary">Guardar nueva contraseña</button>
                        <a th:href="@{/cuenta}" class="btn btn-outline-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
