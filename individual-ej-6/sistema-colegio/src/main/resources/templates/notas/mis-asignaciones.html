<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Notas', activo='notas', content=~{::main})}">
<main>
    <h4 class="fw-bold mb-4"><span class="text-muted fw-light">Notas /</span> Mis asignaciones</h4>
    <div class="row g-4">
        <div class="col-md-6 col-lg-4" th:each="a : ${asignaciones}">
            <div class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title mb-1" th:text="${a.nombreMateria}">Matemática</h5>
                    <p class="text-muted mb-1" th:text="${a.etiquetaAula}">1er Año "A"</p>
                    <p class="text-muted small mb-3" th:text="${a.nombreDocente}">Docente</p>
                    <a th:href="@{/notas/asignacion/{id}(id=${a.id})}" class="btn btn-primary mt-auto">
                        <i class="bx bx-notepad me-1"></i>Cargar notas
                    </a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(asignaciones)}">
            <div class="alert alert-info">Todavía no tiene materias asignadas. Consulte con la administración.</div>
        </div>
    </div>
</main>
</html>
