<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Grados', activo='grados', content=~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><span class="text-muted fw-light">Académico /</span> Grados</h4>
        <a th:href="@{/grados/nuevo}" class="btn btn-primary"><i class="bx bx-plus me-1"></i>Nuevo grado</a>
    </div>
    <div class="card">
        <div class="table-responsive text-nowrap">
            <table class="table">
                <thead><tr><th>Nombre</th><th>Nivel</th><th>Aulas</th><th>Acciones</th></tr></thead>
                <tbody class="table-border-bottom-0">
                <tr th:each="g : ${grados}">
                    <td><a th:href="@{/grados/{id}(id=${g.id})}" th:text="${g.nombre}">1er Año</a></td>
                    <td th:text="${g.nivel}">Secundario</td>
                    <td><span class="badge bg-label-primary" th:text="${g.cantidadAulas}">0</span></td>
                    <td>
                        <a th:href="@{/grados/{id}/editar(id=${g.id})}" class="btn btn-sm p-1"><i class="bx bx-edit-alt"></i></a>
                        <form th:action="@{/grados/{id}/eliminar(id=${g.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este grado?');">
                            <button type="submit" class="btn btn-sm p-1"><i class="bx bx-trash text-danger"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(grados)}"><td colspan="4" class="text-center text-muted py-4">Sin grados cargados.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</html>
