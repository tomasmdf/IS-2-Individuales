<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Docentes', activo='docentes', content=~{::main})}">
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0"><span class="text-muted fw-light">Administración /</span> Docentes</h4>
        <a th:href="@{/docentes/nuevo}" class="btn btn-primary"><i class="bx bx-user-plus me-1"></i>Registrar docente</a>
    </div>

    <div class="card">
        <div class="table-responsive text-nowrap">
            <table class="table">
                <thead>
                <tr>
                    <th>Docente</th>
                    <th>Correo (usuario)</th>
                    <th>Sexo</th>
                    <th>Fecha nacimiento</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody class="table-border-bottom-0">
                <tr th:each="d : ${docentes}">
                    <td><strong th:text="${d.nombreCompleto()}">Apellido, Nombre</strong></td>
                    <td th:text="${d.correo}">correo@colegio.local</td>
                    <td th:text="${d.sexo}">-</td>
                    <td th:text="${#temporals.format(d.fechaNacimiento, 'dd/MM/yyyy')}">-</td>
                    <td><span class="badge bg-label-info" th:text="${d.rol}">DOCENTE</span></td>
                    <td>
                        <span th:if="${d.activo}" class="badge bg-label-success">Activo</span>
                        <span th:unless="${d.activo}" class="badge bg-label-secondary">Inactivo</span>
                    </td>
                    <td>
                        <a th:href="@{/docentes/{id}/editar(id=${d.id})}" class="btn btn-sm p-1">
                            <i class="bx bx-edit-alt"></i>
                        </a>
                        <form th:action="@{/docentes/{id}/alternar-activo(id=${d.id})}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-sm p-1" title="Activar/Inactivar">
                                <i class="bx bx-power-off"></i>
                            </button>
                        </form>
                        <form th:action="@{/docentes/{id}/restablecer-password(id=${d.id})}" method="post" class="d-inline"
                              th:attr="onsubmit=|return confirm('¿Generar una nueva contraseña para ${d.nombreCompleto()} y enviarla por correo a ${d.correo}?');|">
                            <button type="submit" class="btn btn-sm p-1" title="Restablecer contraseña">
                                <i class="bx bx-key text-warning"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(docentes)}">
                    <td colspan="7" class="text-center text-muted py-4">Todavía no hay docentes registrados.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</html>
