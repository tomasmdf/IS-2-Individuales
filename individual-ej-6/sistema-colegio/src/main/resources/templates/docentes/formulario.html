<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Docentes', activo='docentes', content=~{::main})}">
<main>
    <h4 class="fw-bold mb-4">
        <span class="text-muted fw-light">Docentes /</span>
        <span th:text="${docenteRequest.id == null} ? 'Registrar docente' : 'Editar docente'">Formulario</span>
    </h4>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-body">

                    <div th:if="${docenteRequest.id == null}" class="alert alert-info">
                        <i class="bx bx-envelope me-1"></i>
                        Al registrar al docente se generará una contraseña provisoria y se le enviará por
                        correo electrónico a la dirección indicada abajo, junto con el enlace de ingreso.
                    </div>

                    <form th:action="@{/docentes/guardar}" th:object="${docenteRequest}" method="post">
                        <input type="hidden" th:field="*{id}"/>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="nombre">Nombre</label>
                                <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                                       th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{nombre}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="apellido">Apellido</label>
                                <input type="text" id="apellido" class="form-control" th:field="*{apellido}"
                                       th:classappend="${#fields.hasErrors('apellido')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{apellido}"></div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="sexo">Sexo</label>
                                <select id="sexo" class="form-select" th:field="*{sexo}"
                                        th:classappend="${#fields.hasErrors('sexo')} ? 'is-invalid'">
                                    <option value="">Seleccionar...</option>
                                    <option th:each="s : ${sexos}" th:value="${s}" th:text="${s}"></option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{sexo}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="fechaNacimiento">Fecha de nacimiento</label>
                                <input type="date" id="fechaNacimiento" class="form-control" th:field="*{fechaNacimiento}"
                                       th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'"/>
                                <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="correo">Correo personal (será su usuario de acceso)</label>
                            <input type="email" id="correo" class="form-control" th:field="*{correo}"
                                   th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{correo}"></div>
                        </div>

                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a th:href="@{/docentes}" class="btn btn-outline-secondary">Cancelar</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</html>
