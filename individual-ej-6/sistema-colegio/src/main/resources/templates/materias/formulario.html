<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Materias', activo='materias', content=~{::main})}">
<main>
    <h4 class="fw-bold mb-4">
        <span class="text-muted fw-light">Materias /</span>
        <span th:text="${materiaRequest.id == null} ? 'Nueva materia' : 'Editar materia'">Formulario</span>
    </h4>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card"><div class="card-body">
                <form th:action="@{/materias/guardar}" th:object="${materiaRequest}" method="post">
                    <input type="hidden" th:field="*{id}"/>
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                               th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea id="descripcion" class="form-control" th:field="*{descripcion}" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/materias}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div></div>
        </div>
    </div>
</main>
</html>
