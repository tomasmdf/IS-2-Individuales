# =============================================================================
# application.properties
# =============================================================================
# Configuración central de la aplicación Spring Boot.
# Acá se define cómo se conecta el ORM (JPA/Hibernate) a la base MySQL,
# y algunas opciones del motor de plantillas Thymeleaf.
# =============================================================================

# ---- Datos de conexión a MySQL --------------------------------------------
# Cambiar host/puerto/usuario/clave/nombre de la base según el entorno.
# La base "sistema_registro" debe existir previamente en el servidor MySQL
# (o se puede crear agregando ?createDatabaseIfNotExist=true a la URL).
spring.datasource.url=jdbc:mysql://localhost:3306/sistema_registro?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate (ORM) --------------------------------------------------
# ddl-auto=update -> Hibernate crea/actualiza automáticamente las tablas
# a partir de las entidades (@Entity). Útil para el ejercicio; en un
# proyecto real se recomienda usar migraciones (Flyway/Liquibase) y "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf (Vista) -------------------------------------------------------
# En desarrollo conviene desactivar la cache para ver los cambios sin reiniciar.
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---- Sesión HTTP -------------------------------------------------------------
# Tiempo máximo de inactividad de la sesión (usada para saber si el usuario
# está "logueado" -> se guarda el usuario autenticado en la sesión HTTP).
server.servlet.session.timeout=30m

# ---- Cantidad máxima de intentos fallidos antes de bloquear el usuario ------
# Se expone como propiedad configurable en vez de dejarla "hardcodeada"
# en el código (buenas prácticas: parametrizar reglas de negocio).
app.seguridad.max-intentos-fallidos=3

server.port=8080
