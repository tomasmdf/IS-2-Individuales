<!--
=====================================================================================
FRAGMENTO THYMELEAF "head-auth" — usado por login.html y registro.html
=====================================================================================
Contiene EXACTAMENTE los mismos <link>/<script> que trae el <head> de
html/auth-login-basic.html y html/auth-register-basic.html de la plantilla
Sneat original, pero apuntando a los assets ya copiados dentro de
src/main/resources/static/assets/ (servidos por Spring Boot en la raíz
"/assets/..."), en lugar de las rutas relativas "../assets/..." que usa
la plantilla estática.

th:href="@{/assets/...}" es la forma "segura" de Thymeleaf de armar URLs:
antepone automáticamente el contexto de la aplicación (por si la app no
corriera en la raíz "/").
=====================================================================================
-->
<head th:fragment="head(titulo)">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

    <title th:text="${titulo} + ' | Sistema de Registro'">Sistema de Registro</title>
    <meta name="description" content="" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/img/favicon/favicon.ico}" />

    <!-- Fonts (Google Fonts, igual que en la plantilla original) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />

    <!-- Iconos Boxicons (usados por Sneat, ej: bx bx-hide, bx bx-envelope) -->
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />

    <!-- Core CSS del theme -->
    <link rel="stylesheet" th:href="@{/assets/vendor/css/core.css}" class="template-customizer-core-css" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/theme-default.css}" class="template-customizer-theme-css" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />

    <!-- Vendors CSS -->
    <link rel="stylesheet" th:href="@{/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css}" />

    <!-- CSS específico de las páginas de autenticación -->
    <link rel="stylesheet" th:href="@{/assets/vendor/css/pages/page-auth.css}" />

    <!-- Helpers (debe ir antes de config.js, tal como en la plantilla original) -->
    <script th:src="@{/assets/vendor/js/helpers.js}"></script>
    <script th:src="@{/assets/js/config.js}"></script>
</head>
