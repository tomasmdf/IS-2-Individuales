<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Grados', activo='grados', content=~{::main})}">
<main>
    <h4 class="fw-bold mb-4">
        <span class="text-muted fw-light">Grados /</span>
        <span th:text="${gradoRequest.id == null} ? 'Nuevo grado' : 'Editar grado'">Formulario</span>
    </h4>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card"><div class="card-body">
                <form th:action="@{/grados/guardar}" th:object="${gradoRequest}" method="post">
                    <input type="hidden" th:field="*{id}"/>
                    <div class="mb-3">
                        <label class="form-label" for="nombre">Nombre del grado</label>
                        <input type="text" id="nombre" class="form-control" th:field="*{nombre}"
                               placeholder="Ej: 1er Año" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nombre}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="nivel">Nivel educativo</label>
                        <input type="text" id="nivel" class="form-control" th:field="*{nivel}"
                               placeholder="Ej: Secundario" th:classappend="${#fields.hasErrors('nivel')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{nivel}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/grados}" class="btn btn-outline-secondary">Cancelar</a>
                </form>
            </div></div>
        </div>
    </div>
</main>
</html>
