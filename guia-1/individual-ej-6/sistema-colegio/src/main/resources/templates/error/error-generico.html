<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(titulo='Error', activo='', content=~{::main})}">
<main>
    <div class="text-center py-5">
        <i class="bx bx-error bx-lg text-warning mb-3"></i>
        <h3>Ocurrió un problema</h3>
        <p class="text-muted" th:text="${mensaje}">Detalle del error</p>
        <a th:href="@{/dashboard}" class="btn btn-primary mt-2">Volver al panel principal</a>
    </div>
</main>
</html>
