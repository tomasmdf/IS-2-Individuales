# ========================================================================================
# CONFIGURACIÓN PARA EL ENTORNO DE PRUEBAS AUTOMATIZADAS (H2 IN-MEMORY)
# ========================================================================================
spring.datasource.url=jdbc:h2:mem:club_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate genera y destruye el esquema automáticamente en memoria para cada suite
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Deshabilita la ejecución de scripts SQL externos en H2 para evitar sintaxis específica de MySQL
spring.sql.init.mode=never

app.upload.dir=target/test-uploads/rostros/
