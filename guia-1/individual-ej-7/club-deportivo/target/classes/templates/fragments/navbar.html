<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<nav class="layout-navbar container-xxl navbar navbar-expand-xl navbar-detached align-items-center bg-navbar-theme"
     id="layout-navbar"
     th:fragment="navbar">

    <div class="layout-menu-toggle navbar-nav align-items-xl-center me-3 me-xl-0 d-xl-none">
        <a class="nav-item nav-link px-0 me-xl-4" href="javascript:void(0)">
            <i class="bx bx-menu bx-sm"></i>
        </a>
    </div>

    <div class="navbar-nav-right d-flex align-items-center" id="navbar-collapse">
        <!-- Búsqueda rápida en el encabezado -->
        <div class="navbar-nav align-items-center">
            <div class="nav-item d-flex align-items-center">
                <i class="bx bx-search fs-4 lh-0 text-muted"></i>
                <form th:action="@{/socios}" method="get" class="d-inline">
                    <input type="text"
                           name="criterio"
                           class="form-control border-0 shadow-none ps-1 ps-sm-2"
                           placeholder="Buscar por DNI o apellido..."
                           aria-label="Buscar..." />
                </form>
            </div>
        </div>

        <ul class="navbar-nav flex-row align-items-center ms-auto">
            <!-- Indicador de perfil y rol de usuario -->
            <li class="nav-item navbar-dropdown dropdown-user dropdown">
                <a class="nav-link dropdown-toggle hide-arrow" href="javascript:void(0);" data-bs-toggle="dropdown">
                    <div class="avatar avatar-online">
                        <img th:src="@{/assets/img/avatars/1.png}" alt="Avatar" class="w-px-40 h-auto rounded-circle" />
                    </div>
                </a>
                <ul class="dropdown-menu dropdown-menu-end">
                    <li>
                        <a class="dropdown-item" href="#">
                            <div class="d-flex">
                                <div class="flex-shrink-0 me-3">
                                    <div class="avatar avatar-online">
                                        <img th:src="@{/assets/img/avatars/1.png}" alt="Avatar" class="w-px-40 h-auto rounded-circle" />
                                    </div>
                                </div>
                                <div class="flex-grow-1">
                                    <span class="fw-semibold d-block" sec:authentication="name">Operador</span>
                                    <small class="text-muted" sec:authorize="hasRole('ROLE_ADMIN')">Administrador</small>
                                    <small class="text-muted" sec:authorize="hasRole('ROLE_RECEPCIONISTA')">Recepción / Cobranzas</small>
                                </div>
                            </div>
                        </a>
                    </li>
                    <li>
                        <div class="dropdown-divider"></div>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/accesos/control}">
                            <i class="bx bx-scan me-2"></i>
                            <span class="align-middle">Molinete de Acceso</span>
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" th:href="@{/pagos/nuevo}">
                            <i class="bx bx-credit-card me-2"></i>
                            <span class="align-middle">Cobrar Cuota</span>
                        </a>
                    </li>
                    <li>
                        <div class="dropdown-divider"></div>
                    </li>
                    <li>
                        <!-- Cierre de sesión con CSRF Token -->
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="dropdown-item text-danger border-0 bg-transparent">
                                <i class="bx bx-power-off me-2"></i>
                                <span class="align-middle">Cerrar Sesión</span>
                            </button>
                        </form>
                    </li>
                </ul>
            </li>
            <!--/ User -->
        </ul>
    </div>
</nav>
</html>
