# ========================================================================================
# ARCHIVO DE CONFIGURACIÓN PRINCIPAL DE SPRING BOOT (application.properties)
# ========================================================================================
# Este archivo define las propiedades del entorno de ejecución de la aplicación:
# 1. Nombre de la aplicación y puerto del servidor web.
# 2. Conexión a la base de datos MySQL (ORM Hibernate).
# 3. Configuración del motor de plantillas Thymeleaf y recursos estáticos.
# 4. Parámetros para subida de archivos (fotografías de rostros de socios).
# 5. Niveles de log para depuración y auditoría.
# ========================================================================================

# ----------------------------------------------------------------------------------------
# 1. CONFIGURACIÓN DEL SERVIDOR WEB
# ----------------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ----------------------------------------------------------------------------------------
# 2. CONFIGURACIÓN DE BASE DE DATOS MYSQL Y POOL DE CONEXIONES HIKARI-CP
# ----------------------------------------------------------------------------------------
# URL JDBC apuntando al servicio MySQL local en el puerto 3306.
# createDatabaseIfNotExist=true asegura que MySQL cree el esquema automáticamente si no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/club_deportivo_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del Pool de Conexiones HikariCP (Optimizado para alta concurrencia)
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ----------------------------------------------------------------------------------------
# 3. CONFIGURACIÓN DEL ORM HIBERNATE / JPA
# ----------------------------------------------------------------------------------------
# update: actualiza automáticamente las tablas según las clases @Entity sin destruir datos existentes.
spring.jpa.hibernate.ddl-auto=update
# Muestra las sentencias SQL en consola para auditoría y aprendizaje didáctico.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Hibernate maneja el esquema con ddl-auto; deshabilitamos la ejecución duplicada de scripts SQL
spring.sql.init.mode=never

# ----------------------------------------------------------------------------------------
# 4. CONFIGURACIÓN DEL MOTOR DE VISTAS THYMELEAF
# ----------------------------------------------------------------------------------------
# En desarrollo deshabilitamos la caché de Thymeleaf para reflejar cambios HTML inmediatamente.
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----------------------------------------------------------------------------------------
# 5. CONFIGURACIÓN DE SUBIDA DE ARCHIVOS MULTIPART (FOTOS DE ROSTRO)
# ----------------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Ruta del directorio en el sistema de archivos donde se almacenarán las imágenes de rostros
app.upload.dir=uploads/rostros/

# ----------------------------------------------------------------------------------------
# 6. LOGS Y AUDITORÍA
# ----------------------------------------------------------------------------------------
logging.level.com.clubdeportivo=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
