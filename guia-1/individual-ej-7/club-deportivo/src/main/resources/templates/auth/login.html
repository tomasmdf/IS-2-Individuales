<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      class="light-style customizer-hide"
      dir="ltr"
      data-theme="theme-default"
      data-assets-path="/assets/">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Iniciar Sesión - Club Deportivo</title>

    <link rel="icon" type="image/x-icon" th:href="@{/assets/img/favicon/favicon.ico}" />
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/core.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/pages/page-auth.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
</head>

<body>
    <div class="container-xxl">
        <div class="authentication-wrapper authentication-basic container-p-y">
            <div class="authentication-inner">
                <!-- Tarjeta de Login -->
                <div class="card">
                    <div class="card-body">
                        <!-- Logo & Título -->
                        <div class="app-brand justify-content-center mb-3">
                            <a th:href="@{/login}" class="app-brand-link gap-2">
                                <span class="app-brand-logo demo">
                                    <i class="bx bxs-trophy text-primary" style="font-size: 2.5rem;"></i>
                                </span>
                                <span class="app-brand-text demo text-body fw-bolder text-uppercase" style="font-size: 1.4rem;">
                                    Club Deportivo
                                </span>
                            </a>
                        </div>

                        <h4 class="mb-2 text-center">¡Bienvenido al Sistema! 👋</h4>
                        <p class="mb-4 text-center text-muted">Ingrese sus credenciales para acceder a la gestión de socios, control perimetral y cobranzas.</p>

                        <!-- Alertas de error o cierre de sesión -->
                        <div th:if="${mensajeError}" class="alert alert-danger" role="alert">
                            <i class="bx bx-error-circle me-1"></i> <span th:text="${mensajeError}"></span>
                        </div>
                        <div th:if="${mensajeExito}" class="alert alert-success" role="alert">
                            <i class="bx bx-check-circle me-1"></i> <span th:text="${mensajeExito}"></span>
                        </div>

                        <!-- Formulario de autenticación -->
                        <form id="formAuthentication" class="mb-3" th:action="@{/login}" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text"
                                       class="form-control"
                                       id="username"
                                       name="username"
                                       placeholder="Ingrese su usuario..."
                                       autofocus
                                       required />
                            </div>
                            <div class="mb-3 form-password-toggle">
                                <div class="d-flex justify-content-between">
                                    <label class="form-label" for="password">Contraseña</label>
                                </div>
                                <div class="input-group input-group-merge">
                                    <input type="password"
                                           id="password"
                                           class="form-control"
                                           name="password"
                                           placeholder="&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;&#xb7;"
                                           required />
                                    <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                                </div>
                            </div>

                            <div class="mb-3">
                                <button class="btn btn-primary d-grid w-100" type="submit">
                                    <i class="bx bx-log-in me-1"></i> Iniciar Sesión
                                </button>
                            </div>
                        </form>

                        <!-- Credenciales de prueba didácticas -->
                        <div class="p-3 bg-light rounded border">
                            <h6 class="mb-2 text-primary fw-bold"><i class="bx bx-info-circle me-1"></i> Credenciales de Acceso:</h6>
                            <ul class="list-unstyled mb-0 small text-muted">
                                <li><strong>Admin:</strong> <code>admin</code> / <code>admin123</code> (Control total)</li>
                                <li><strong>Recepción:</strong> <code>recepcion</code> / <code>recep123</code> (Accesos y pagos)</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <!-- / Tarjeta de Login -->
            </div>
        </div>
    </div>

    <script th:src="@{/assets/vendor/js/bootstrap.js}"></script>
</body>
</html>
