<!DOCTYPE html>
<!--
    ========================================================================================
    PLANTILLA BASE MAESTRA: layout.html (Sneat Admin Template + Thymeleaf)
    ========================================================================================
    Define el diseño estructural de la aplicación con Bootstrap 5 y la plantilla Sneat:
    - Sidebar de navegación lateral responsivo
    - Barra de navegación superior con perfil de usuario y cierre de sesión
    - Contenedor dinámico th:replace para inyectar las vistas específicas
    - Pie de página institucional
    - Inclusión de hojas de estilo CSS y scripts JS
    ========================================================================================
-->
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      class="light-style layout-menu-fixed"
      dir="ltr"
      data-theme="theme-default"
      data-assets-path="/assets/"
      data-template="vertical-menu-template-free"
      th:fragment="layout(content)">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Club Deportivo - Sistema de Gestión</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/assets/img/favicon/favicon.ico}" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />

    <!-- Iconos: Boxicons CDN & Iconify -->
    <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/iconify-icons.css}" />

    <!-- Estilos de la plantilla Sneat -->
    <link rel="stylesheet" th:href="@{/assets/vendor/css/core.css}" class="template-customizer-core-css" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css}" />

    <!-- Helpers de Sneat -->
    <script th:src="@{/assets/vendor/js/helpers.js}"></script>
    <script th:src="@{/assets/js/config.js}"></script>

    <style>
        /* Estilos complementarios para imágenes faciales y credenciales */
        .avatar-facial {
            width: 44px;
            height: 44px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #696cff;
        }
        .avatar-facial-lg {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #696cff;
            box-shadow: 0 4px 10px rgba(105, 108, 255, 0.25);
        }
        .avatar-facial-control {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 16px;
            border: 4px solid #696cff;
            box-shadow: 0 8px 24px rgba(105, 108, 255, 0.35);
        }
    </style>
</head>

<body>
    <!-- Layout wrapper -->
    <div class="layout-wrapper layout-content-navbar">
        <div class="layout-container">

            <!-- Sidebar / Menú Lateral -->
            <aside th:replace="~{fragments/sidebar :: sidebar}"></aside>

            <!-- Layout container -->
            <div class="layout-page">

                <!-- Navbar / Barra Superior -->
                <nav th:replace="~{fragments/navbar :: navbar}"></nav>

                <!-- Content wrapper -->
                <div class="content-wrapper">

                    <!-- Contenido Central Dinámico -->
                    <div class="container-xxl flex-grow-1 container-p-y">
                        <!-- Mensajes Flash de Éxito y Error -->
                        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible" role="alert">
                            <span class="bx bx-check-circle me-1"></span>
                            <span th:text="${mensajeExito}">Operación exitosa</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible" role="alert">
                            <span class="bx bx-error-circle me-1"></span>
                            <span th:text="${mensajeError}">Ocurrió un error</span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Inyección del contenido específico -->
                        <div th:replace="${content}"></div>
                    </div>

                    <!-- Footer / Pie de página -->
                    <footer th:replace="~{fragments/footer :: footer}"></footer>

                    <div class="content-backdrop fade"></div>
                </div>
                <!-- / Content wrapper -->
            </div>
            <!-- / Layout page -->
        </div>

        <!-- Overlay -->
        <div class="layout-overlay layout-menu-toggle"></div>
    </div>
    <!-- / Layout wrapper -->

    <!-- Core JS Sneat -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script th:src="@{/assets/vendor/js/bootstrap.js}"></script>
    <script th:src="@{/assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js}"></script>
    <script th:src="@{/assets/vendor/js/menu.js}"></script>
    <script th:src="@{/assets/js/main.js}"></script>
</body>
</html>
