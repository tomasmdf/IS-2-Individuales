<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section}, 'Usuarios')}">
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Usuarios del sistema</h4>
    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary"><i class="bx bx-plus"></i> Nuevo usuario</a>
  </div>

  <div class="card">
    <div class="table-responsive text-nowrap">
      <table class="table">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Nombre completo</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${usuarios}">
            <td th:text="${u.username}"></td>
            <td th:text="${u.nombreCompleto}"></td>
            <td><span class="badge bg-label-info" th:text="${u.rol}"></span></td>
            <td>
              <span class="badge" th:classappend="${u.activo} ? 'bg-label-success' : 'bg-label-secondary'"
                    th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span>
            </td>
            <td>
              <a th:href="@{'/usuarios/' + ${u.id} + '/editar'}" class="btn btn-sm btn-icon btn-outline-primary me-1">
                <i class="bx bx-edit"></i>
              </a>
              <form th:action="@{'/usuarios/' + ${u.id} + '/eliminar'}" method="post" class="d-inline"
                    onsubmit="return confirm('¿Dar de baja este usuario?');">
                <button type="submit" class="btn btn-sm btn-icon btn-outline-danger"><i class="bx bx-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="5" class="text-center text-muted">No hay usuarios cargados</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
