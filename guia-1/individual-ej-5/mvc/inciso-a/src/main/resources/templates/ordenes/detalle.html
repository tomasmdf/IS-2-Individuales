<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section}, 'Detalle de Orden de Compra')}">
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Orden de compra <span th:text="${orden.numero}"></span></h4>
    <span class="badge fs-6"
          th:classappend="${orden.estado.name() == 'PENDIENTE'} ? 'bg-label-warning' : (${orden.estado.name() == 'RECIBIDA'} ? 'bg-label-success' : 'bg-label-secondary')"
          th:text="${orden.estado}"></span>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <div class="row">
        <div class="col-md-3"><span class="text-muted d-block">Proveedor</span><b th:text="${orden.proveedorNombre}"></b></div>
        <div class="col-md-3"><span class="text-muted d-block">Fecha</span><b th:text="${#temporals.format(orden.fecha, 'dd/MM/yyyy')}"></b></div>
        <div class="col-md-3"><span class="text-muted d-block">Registrada por</span><b th:text="${orden.usuarioNombre}"></b></div>
        <div class="col-md-3"><span class="text-muted d-block">Total</span>
          <b th:text="${'$ ' + #numbers.formatDecimal(orden.total, 1, 'POINT', 2, 'COMMA')}"></b>
        </div>
      </div>
      <div class="mt-3" th:if="${orden.observaciones}">
        <span class="text-muted d-block">Observaciones</span>
        <span th:text="${orden.observaciones}"></span>
      </div>
    </div>
  </div>

  <div class="card mb-4">
    <h5 class="card-header">Detalle de productos</h5>
    <div class="table-responsive text-nowrap">
      <table class="table">
        <thead>
          <tr><th>Codigo</th><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th></tr>
        </thead>
        <tbody>
          <tr th:each="d : ${orden.detalles}">
            <td th:text="${d.productoCodigo}"></td>
            <td th:text="${d.productoNombre}"></td>
            <td th:text="${d.cantidad}"></td>
            <td th:text="${'$ ' + #numbers.formatDecimal(d.precioUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td th:text="${'$ ' + #numbers.formatDecimal(d.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="d-flex gap-2">
    <form th:if="${orden.estado.name() == 'PENDIENTE'}" th:action="@{'/ordenes-compra/' + ${orden.id} + '/recibir'}" method="post"
          onsubmit="return confirm('¿Confirmar la recepcion de esta orden? Esto actualizara el stock de los productos.');">
      <button type="submit" class="btn btn-success"><i class="bx bx-check"></i> Recibir orden (actualiza stock)</button>
    </form>
    <form th:if="${orden.estado.name() == 'PENDIENTE'}" th:action="@{'/ordenes-compra/' + ${orden.id} + '/anular'}" method="post"
          onsubmit="return confirm('¿Anular esta orden de compra?');">
      <button type="submit" class="btn btn-outline-danger"><i class="bx bx-x"></i> Anular orden</button>
    </form>
    <a th:href="@{/ordenes-compra}" class="btn btn-outline-secondary">Volver al listado</a>
  </div>
</section>
</body>
</html>
