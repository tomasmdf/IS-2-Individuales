<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section}, 'Categoria')}">
<body>
<section>
  <h4 class="fw-bold mb-4" th:text="${categoria.id} != null ? 'Editar categoria' : 'Nueva categoria'"></h4>

  <div class="card">
    <div class="card-body">

      <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

      <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text" class="form-control" th:field="*{nombre}"
                 th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" />
          <div class="invalid-feedback" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Descripcion</label>
          <textarea class="form-control" th:field="*{descripcion}" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</section>
</body>
</html>
