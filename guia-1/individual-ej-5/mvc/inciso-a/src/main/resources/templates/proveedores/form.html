<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section}, 'Proveedor')}">
<body>
<section>
  <h4 class="fw-bold mb-4" th:text="${proveedor.id} != null ? 'Editar proveedor' : 'Nuevo proveedor'"></h4>

  <div class="card">
    <div class="card-body">

      <div th:if="${mensajeError}" class="alert alert-danger" th:text="${mensajeError}"></div>

      <form th:action="@{/proveedores/guardar}" th:object="${proveedor}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label">Razon social</label>
            <input type="text" class="form-control" th:field="*{razonSocial}"
                   th:classappend="${#fields.hasErrors('razonSocial')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('razonSocial')}" th:errors="*{razonSocial}"></div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">CUIT</label>
            <input type="text" class="form-control" th:field="*{cuit}" placeholder="XX-XXXXXXXX-X"
                   th:classappend="${#fields.hasErrors('cuit')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('cuit')}" th:errors="*{cuit}"></div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Telefono</label>
            <input type="text" class="form-control" th:field="*{telefono}" />
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" />
            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Estado</label>
            <div class="form-check form-switch mt-2">
              <input class="form-check-input" type="checkbox" th:field="*{activo}" />
              <label class="form-check-label">Activo</label>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Direccion</label>
          <input type="text" class="form-control" th:field="*{direccion}" />
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/proveedores}" class="btn btn-outline-secondary">Cancelar</a>
      </form>
    </div>
  </div>
</section>
</body>
</html>
