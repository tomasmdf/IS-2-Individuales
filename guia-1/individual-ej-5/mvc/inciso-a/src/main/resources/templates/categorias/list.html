<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(~{::section}, 'Categorias')}">
<body>
<section>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Categorias</h4>
    <a th:href="@{/categorias/nueva}" class="btn btn-primary"><i class="bx bx-plus"></i> Nueva categoria</a>
  </div>

  <div class="card">
    <div class="table-responsive text-nowrap">
      <table class="table">
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Descripcion</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="c : ${categorias}">
            <td th:text="${c.nombre}"></td>
            <td th:text="${c.descripcion}"></td>
            <td>
              <a th:href="@{'/categorias/' + ${c.id} + '/editar'}" class="btn btn-sm btn-icon btn-outline-primary me-1">
                <i class="bx bx-edit"></i>
              </a>
              <form th:action="@{'/categorias/' + ${c.id} + '/eliminar'}" method="post" class="d-inline"
                    onsubmit="return confirm('¿Eliminar esta categoria?');">
                <button type="submit" class="btn btn-sm btn-icon btn-outline-danger"><i class="bx bx-trash"></i></button>
              </form>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(categorias)}">
            <td colspan="3" class="text-center text-muted">No hay categorias cargadas</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>
</body>
</html>
