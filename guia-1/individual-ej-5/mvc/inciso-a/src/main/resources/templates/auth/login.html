<!DOCTYPE html>
<!--
  ============================================================================
  auth/login.html
  ============================================================================
  Pantalla de autenticacion (usuario + contraseña), maquetada con la
  plantilla "Sneat" (estilo auth-login-basic). No utiliza el layout general
  (layout/main.html) porque el usuario todavia no esta autenticado y por lo
  tanto no debe verse el menu ni el navbar.

  El formulario postea directamente a "/login", procesado por Spring
  Security (ver SecurityConfig -> formLogin().loginProcessingUrl("/login")).
  Los parametros de campo deben llamarse "username" y "password" (nombres
  por defecto que espera Spring Security).
  ============================================================================
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesion - Sistema de Compras</title>
    <link rel="icon" type="image/x-icon" th:href="@{/assets/img/favicon/favicon.ico}" />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/core.css}" />
    <link rel="stylesheet" th:href="@{/assets/vendor/css/theme-default.css}" />
    <link rel="stylesheet" th:href="@{/assets/css/demo.css}" />
    <script th:src="@{/assets/vendor/js/helpers.js}"></script>
    <script th:src="@{/assets/js/config.js}"></script>
</head>
<body>
<div class="container-xxl">
  <div class="authentication-wrapper authentication-basic container-p-y" style="min-height:100vh; display:flex; align-items:center;">
    <div class="authentication-inner" style="max-width:420px; margin:0 auto; width:100%;">

      <div class="card">
        <div class="card-body">

          <div class="app-brand justify-content-center mb-4 mt-2">
            <span class="app-brand-link gap-2">
              <i class='bx bx-chip text-primary' style="font-size: 2.2rem;"></i>
              <span class="app-brand-text demo text-body fw-bolder">CompraStock</span>
            </span>
          </div>

          <h4 class="mb-1">Bienvenido 👋</h4>
          <p class="mb-4">Ingrese su usuario y contraseña para acceder al sistema</p>

          <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Usuario o contraseña incorrectos.
          </div>
          <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Sesion cerrada correctamente.
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Ingrese su usuario" autofocus required />
            </div>
            <div class="mb-3 form-password-toggle">
              <label class="form-label" for="password">Contraseña</label>
              <input type="password" id="password" class="form-control" name="password" placeholder="&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;" required />
            </div>
            <div class="mb-3">
              <button class="btn btn-primary d-grid w-100" type="submit">Ingresar</button>
            </div>
          </form>

          <p class="text-center mt-3 small text-muted">
            Usuario demo: <b>admin</b> / <b>admin123</b> (rol ADMIN)<br/>
            Usuario demo: <b>operador</b> / <b>admin123</b> (rol OPERADOR)
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
