# ============================================================================
# application.properties
# Configuracion general de la aplicacion Spring Boot
# ============================================================================

spring.application.name=compras

# ---------------------------------------------------------------------------
# Conexion a base de datos MySQL
# Ajustar host/puerto/usuario/clave/schema segun el ambiente de despliegue.
# La base "compras_db" debe existir previamente (crearla con CREATE DATABASE).
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/compras_db?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate (ORM)
# ddl-auto=update -> Hibernate crea/actualiza las tablas segun las @Entity.
# En un ambiente productivo se recomienda usar "validate" + scripts de
# migracion (Flyway/Liquibase), pero para el alcance del trabajo practico
# se utiliza "update" para simplificar la puesta en marcha.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# Permite que data.sql se ejecute DESPUES de que Hibernate cree las tablas
# (ddl-auto=update), para poder insertar el usuario administrador inicial.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ---------------------------------------------------------------------------
# Thymeleaf (VISTA)
# ---------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ---------------------------------------------------------------------------
# Servidor
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.com.empresa.compras=DEBUG
